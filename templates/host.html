<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хост · morozovka-bridge</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; padding: 32px 24px 80px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at 20% 0%, #1e2a4a 0%, #0d1117 60%);
        color: #e6edf3; font-size: 14px; line-height: 1.5;
    }
    .container { max-width: 1500px; margin: 0 auto; }

    header {
        display: flex; align-items: center; gap: 20px;
        margin-bottom: 24px; flex-wrap: wrap;
    }
    h1 {
        font-size: 1.6rem; font-weight: 700; margin: 0;
        background: linear-gradient(90deg, #58a6ff, #a371f7, #f778ba);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .host-sub {
        color: #8b949e; font-size: 0.85rem;
        font-family: ui-monospace, monospace; margin-left: 4px;
    }
    .back-link {
        color: #8b949e; text-decoration: none; font-size: 0.9rem;
        padding: 6px 12px; border: 1px solid #30363d; border-radius: 8px;
    }
    .back-link:hover { color: #58a6ff; border-color: #58a6ff; }
    .spacer { flex: 1; }

    .period-btns {
        display: inline-flex; gap: 4px;
        background: rgba(22,27,34,0.6); padding: 4px;
        border-radius: 8px; border: 1px solid #30363d;
    }
    .period-btns button {
        padding: 6px 12px; border-radius: 6px;
        background: transparent; border: none; cursor: pointer;
        color: #8b949e; font-size: 0.82rem; font-weight: 600;
        transition: all .15s;
    }
    .period-btns button:hover { color: #58a6ff; }
    .period-btns button.active {
        background: #21262d; color: #58a6ff;
    }

    .metric-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px; margin-bottom: 24px;
    }
    .metric-card {
        background: rgba(22, 27, 34, 0.6);
        border: 1px solid #30363d; border-radius: 12px;
        padding: 14px 16px;
    }
    .metric-card .label {
        font-size: 0.68rem; color: #8b949e; text-transform: uppercase;
        letter-spacing: 0.8px; font-weight: 600; margin-bottom: 6px;
    }
    .metric-card .value {
        font-size: 1.4rem; font-weight: 700;
        font-family: ui-monospace, monospace;
    }
    .metric-card .sub {
        font-size: 0.72rem; color: #8b949e; margin-top: 4px;
        font-family: ui-monospace, monospace;
    }

    .chart-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
        gap: 16px; margin-bottom: 24px;
    }
    .chart-card {
        background: rgba(22, 27, 34, 0.6);
        border: 1px solid #30363d; border-radius: 12px;
        padding: 16px 18px;
    }
    .chart-card h3 {
        margin: 0 0 12px; font-size: 0.95rem;
        color: #c9d1d9; font-weight: 600;
    }
    .chart-wrap { position: relative; height: 220px; }

    .card {
        background: rgba(22, 27, 34, 0.6);
        border: 1px solid #30363d; border-radius: 12px;
        padding: 18px 20px; margin-bottom: 16px;
    }
    .card h3 {
        margin: 0 0 14px; font-size: 0.95rem;
        color: #c9d1d9; font-weight: 600;
    }

    table { width: 100%; border-collapse: collapse; }
    th {
        text-align: left; padding: 10px 12px;
        background: rgba(13, 17, 23, 0.6); color: #8b949e;
        font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.8px;
        border-bottom: 1px solid #30363d; font-weight: 600;
    }
    td {
        padding: 10px 12px; border-bottom: 1px solid rgba(48,54,61,0.5);
        font-size: 0.85rem;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(88,166,255,0.04); }
    td code {
        font-family: ui-monospace, monospace;
        background: rgba(88,166,255,0.1); color: #79c0ff;
        padding: 2px 7px; border-radius: 4px; font-size: 0.85em;
    }

    .disk-bar {
        display: inline-block; vertical-align: middle;
        width: 100px; height: 6px; border-radius: 3px;
        background: #0d1117; overflow: hidden;
        border: 1px solid #21262d; margin-right: 8px;
    }
    .disk-bar > div { height: 100%; border-radius: 3px; transition: width .3s; }

    .top-table td:first-child { color: #8b949e; width: 40px; }
    .top-table td:nth-child(2) { font-family: ui-monospace, monospace; }
    .top-table td:last-child {
        text-align: right; font-family: ui-monospace, monospace;
        color: #58a6ff; width: 100px;
    }

    .error-msg {
        color: #f85149; font-size: 0.85rem;
        font-family: ui-monospace, monospace;
        padding: 14px 18px; background: rgba(248,81,73,0.08);
        border: 1px solid rgba(248,81,73,0.3);
        border-radius: 10px;
        word-break: break-word;
    }

    footer {
        margin-top: 40px; padding-top: 20px;
        border-top: 1px solid #30363d;
        color: #484f58; font-size: 0.8rem; text-align: center;
    }
    #updated { color: #8b949e; font-size: 0.82rem; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div class="container">

    <header>
        <a href="/metrics" class="back-link">← К мониторингу</a>
        <h1 id="page-host">Загрузка…</h1>
        <span class="host-sub" id="page-sub"></span>
        <div class="spacer"></div>
        <div class="period-btns" id="periods">
            <button data-min="5">5 мин</button>
            <button data-min="30">30 мин</button>
            <button data-min="120">2 часа</button>
            <button data-min="0" class="active">Всё</button>
        </div>
        <span id="updated"></span>
    </header>

    <div id="error-block" class="error-msg" style="display:none;"></div>

    <div id="content">
        <div class="metric-grid" id="metrics-grid"></div>

        <div class="chart-grid">
            <div class="chart-card">
                <h3>CPU, %</h3>
                <div class="chart-wrap"><canvas id="chart-cpu"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>RAM, %</h3>
                <div class="chart-wrap"><canvas id="chart-mem"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>Сеть (RX / TX)</h3>
                <div class="chart-wrap"><canvas id="chart-net"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>Load average (1 мин)</h3>
                <div class="chart-wrap"><canvas id="chart-load"></canvas></div>
            </div>
        </div>

        <div class="card">
            <h3>Файловые системы</h3>
            <table id="disks-table">
                <thead>
                    <tr>
                        <th>Точка монтирования</th>
                        <th>Тип</th>
                        <th>Использовано</th>
                        <th>Занято</th>
                        <th style="text-align:right;">%</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="card">
            <h3>Топ процессов по CPU</h3>
            <table class="top-table" id="top-table">
                <tbody></tbody>
            </table>
        </div>
    </div>

    <footer>
        morozovka-bridge · детальная статистика · авто-обновление 5 сек
    </footer>

</div>

<script>
const HOST_NAME = {{ host_name|tojson }};
const REFRESH_MS = 5000;

let periodMin = 0;
let history = null;

// Chart.js defaults под тёмную тему
Chart.defaults.color = '#8b949e';
Chart.defaults.borderColor = 'rgba(48, 54, 61, 0.5)';
Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
Chart.defaults.font.size = 11;

const charts = {};

function fmtBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}
function fmtKb(kb) { return fmtBytes(kb * 1024); }
function fmtUptime(seconds) {
    const d = Math.floor(seconds / 86400);
    const h = Math.floor((seconds % 86400) / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    if (d > 0) return `${d}д ${h}ч`;
    if (h > 0) return `${h}ч ${m}м`;
    return `${m}м`;
}

function avg(arr) {
    if (!arr || !arr.length) return 0;
    return arr.reduce((a, b) => a + b, 0) / arr.length;
}
function max(arr) {
    if (!arr || !arr.length) return 0;
    return Math.max.apply(null, arr);
}

function barClass(pct) {
    if (pct >= 80) return 'fill-red';
    if (pct >= 60) return 'fill-yellow';
    return 'fill-green';
}

function pickRootDisk(disks) {
    if (!disks || !disks.length) return { total_kb: 0, used_kb: 0, pct: 0, mount: '/' };
    return disks.find(d => d.mount === '/') || disks[0];
}

function renderMetrics(h) {
    const cpu = parseFloat(h.cpu_pct || 0);
    const mem = parseFloat(h.mem_pct || 0);
    const temp = h.temp_c > 0 ? `${h.temp_c}°C` : '—';
    const rootDisk = pickRootDisk(h.disks);
    const diskPct = parseFloat(rootDisk.pct || 0);

    const grid = document.getElementById('metrics-grid');
    grid.innerHTML = `
        <div class="metric-card">
            <div class="label">CPU</div>
            <div class="value">${cpu.toFixed(1)}%</div>
            <div class="sub">${h.cores} ядер · load ${h.load}</div>
        </div>
        <div class="metric-card">
            <div class="label">RAM</div>
            <div class="value">${mem.toFixed(1)}%</div>
            <div class="sub">${fmtKb(h.mem_used_kb)} / ${fmtKb(h.mem_total_kb)}</div>
        </div>
        <div class="metric-card">
            <div class="label">Disk ${rootDisk.mount}</div>
            <div class="value">${diskPct.toFixed(0)}%</div>
            <div class="sub">${fmtKb(rootDisk.used_kb)} / ${fmtKb(rootDisk.total_kb)}</div>
        </div>
        <div class="metric-card">
            <div class="label">Uptime</div>
            <div class="value" style="font-size:1.1rem;">${fmtUptime(h.uptime)}</div>
            <div class="sub">${h.hostname}</div>
        </div>
        <div class="metric-card">
            <div class="label">Температура</div>
            <div class="value">${temp}</div>
            <div class="sub">${h.host}</div>
        </div>
        <div class="metric-card">
            <div class="label">Сеть</div>
            <div class="value" style="font-size:1rem;">↓ ${fmtBytes(h.net_rx)}</div>
            <div class="sub">↑ ${fmtBytes(h.net_tx)}</div>
        </div>
    `;

    // Таблица дисков
    const tbody = document.querySelector('#disks-table tbody');
    const disks = h.disks || [];
    if (!disks.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#8b949e;">нет данных</td></tr>';
    } else {
        tbody.innerHTML = disks.map(d => `
            <tr>
                <td><code>${d.mount}</code></td>
                <td>${d.fstype}</td>
                <td>
                    <span class="disk-bar"><div class="${barClass(d.pct)}" style="width:${d.pct}%"></div></span>
                    ${d.pct}%
                </td>
                <td>${fmtKb(d.used_kb)} / ${fmtKb(d.total_kb)}</td>
                <td style="text-align:right;color:${d.pct >= 80 ? '#f85149' : (d.pct >= 60 ? '#d29922' : '#3fb950')};">
                    ${d.pct}%
                </td>
            </tr>
        `).join('');
    }

    // Топ процессов
    const topBody = document.querySelector('#top-table tbody');
    const procs = (h.top || '').split(';').filter(x => x).map(x => {
        const idx = x.lastIndexOf(':');
        if (idx === -1) return { name: x, cpu: 0 };
        return { name: x.slice(0, idx), cpu: parseFloat(x.slice(idx + 1)) || 0 };
    });
    if (!procs.length) {
        topBody.innerHTML = '<tr><td colspan="2" style="color:#8b949e;">нет данных</td></tr>';
    } else {
        topBody.innerHTML = procs.map((p, i) => `
            <tr>
                <td>${i + 1}</td>
                <td>${p.name}</td>
                <td>${p.cpu.toFixed(1)}%</td>
            </tr>
        `).join('');
    }
}

function buildChart(canvasId, labels, datasets, yOpts) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    if (charts[canvasId]) charts[canvasId].destroy();
    charts[canvasId] = new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: datasets.length > 1, position: 'top' },
                tooltip: {
                    backgroundColor: 'rgba(13,17,23,0.95)',
                    borderColor: '#30363d',
                    borderWidth: 1,
                    titleColor: '#e6edf3',
                    bodyColor: '#c9d1d9',
                }
            },
            scales: {
                x: {
                    ticks: { maxTicksLimit: 8, autoSkip: true },
                    grid: { display: false },
                },
                y: Object.assign({ beginAtZero: true }, yOpts || {}),
            },
            elements: {
                point: { radius: 0, hoverRadius: 3 },
                line: { tension: 0.2, borderWidth: 2 },
            },
        },
    });
    return charts[canvasId];
}

function renderCharts(hist) {
    if (!hist) return;
    const ts = hist.ts || [];
    const cpu = hist.cpu || [];
    const mem = hist.mem || [];
    const netRx = hist.net_rx || [];
    const netTx = hist.net_tx || [];
    const load = hist.load1 || [];

    // Обрезаем по периоду
    let start = 0;
    if (periodMin > 0 && ts.length) {
        const cutoff = ts[ts.length - 1] - periodMin * 60;
        start = ts.findIndex(t => t >= cutoff);
        if (start < 0) start = 0;
    }

    const sTs = ts.slice(start);
    const sCpu = cpu.slice(start);
    const sMem = mem.slice(start);
    const sNetRx = netRx.slice(start);
    const sNetTx = netTx.slice(start);
    const sLoad = load.slice(start);

    const labels = sTs.map(t => new Date(t * 1000).toLocaleTimeString());

    // Конвертируем счётчики net_rx/net_tx в дельту (Мбит/с между точками)
    const netRxRate = [];
    const netTxRate = [];
    for (let i = 0; i < sNetRx.length; i++) {
        if (i === 0) { netRxRate.push(0); netTxRate.push(0); continue; }
        const dt = sTs[i] - sTs[i - 1];
        if (dt <= 0) { netRxRate.push(0); netTxRate.push(0); continue; }
        const drx = Math.max(0, sNetRx[i] - sNetRx[i - 1]);
        const dtx = Math.max(0, sNetTx[i] - sNetTx[i - 1]);
        netRxRate.push(drx / dt / 1024); // КБ/с
        netTxRate.push(dtx / dt / 1024);
    }

    buildChart('chart-cpu', labels, [{
        label: 'CPU %',
        data: sCpu,
        borderColor: '#58a6ff',
        backgroundColor: 'rgba(88,166,255,0.1)',
        fill: true,
    }], { max: 100, ticks: { callback: v => v + '%' } });

    buildChart('chart-mem', labels, [{
        label: 'RAM %',
        data: sMem,
        borderColor: '#f778ba',
        backgroundColor: 'rgba(247,120,186,0.1)',
        fill: true,
    }], { max: 100, ticks: { callback: v => v + '%' } });

    buildChart('chart-net', labels, [
        {
            label: 'RX, КБ/с',
            data: netRxRate,
            borderColor: '#3fb950',
            backgroundColor: 'rgba(63,185,80,0.1)',
            fill: true,
        },
        {
            label: 'TX, КБ/с',
            data: netTxRate,
            borderColor: '#d29922',
            backgroundColor: 'rgba(210,153,34,0.1)',
            fill: true,
        },
    ], { ticks: { callback: v => v + ' КБ/с' } });

    buildChart('chart-load', labels, [{
        label: 'Load 1m',
        data: sLoad,
        borderColor: '#a371f7',
        backgroundColor: 'rgba(163,113,247,0.1)',
        fill: true,
    }], { ticks: { callback: v => v.toFixed(2) } });
}

async function loadHost() {
    try {
        const r = await fetch('/api/host/' + encodeURIComponent(HOST_NAME));
        const data = await r.json();
        if (!data.ok) {
            document.getElementById('error-block').style.display = 'block';
            document.getElementById('error-block').textContent =
                'Ошибка: ' + (data.error || 'not found');
            return;
        }
        const h = data.host;
        document.getElementById('page-host').textContent = h.name;
        document.getElementById('page-sub').textContent =
            `${h.host} · ${h.role}${h.hostname ? ' · ' + h.hostname : ''}`;

        if (!h.ok) {
            document.getElementById('error-block').style.display = 'block';
            document.getElementById('error-block').textContent =
                'Хост недоступен: ' + (h.error || 'неизвестная ошибка');
            document.getElementById('content').style.display = 'none';
            return;
        }
        document.getElementById('error-block').style.display = 'none';
        document.getElementById('content').style.display = '';
        renderMetrics(h);
        document.getElementById('updated').textContent =
            'обновлено ' + new Date().toLocaleTimeString();
    } catch (e) {
        document.getElementById('error-block').style.display = 'block';
        document.getElementById('error-block').textContent = 'Ошибка: ' + e;
    }
}

async function loadHistory() {
    try {
        const r = await fetch('/api/history/' + encodeURIComponent(HOST_NAME));
        const data = await r.json();
        if (data.ok) {
            history = data.history;
            renderCharts(history);
        }
    } catch (e) {
        // ничего не делаем, история необязательна
    }
}

// Переключатели периода
document.querySelectorAll('#periods button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('#periods button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        periodMin = parseInt(btn.dataset.min);
        if (history) renderCharts(history);
    });
});

loadHost();
loadHistory();
setInterval(loadHost, REFRESH_MS);
setInterval(loadHistory, REFRESH_MS * 3);
</script>
</body>
</html>
